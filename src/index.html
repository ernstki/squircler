<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Free Squircle Generator – Smooth Rounded Image Tool (No Login)</title>

  <meta name="description" content="Free online squircle generator to turn any image into a smooth, rounded squircle shape. Upload, adjust padding, preview, and download. Fast, mobile-friendly, no login required.">

  <meta name="keywords" content="free squircle generator, online image squircle tool, rounded image corners, squircle icon maker, squircle crop tool, app icon generator, no login squircle, image editor online">

  <meta name="robots" content="index, follow" />
  <meta name="author" content="Azmal" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-text">Drop your image here or click to upload</div>
                <div class="upload-subtext">Supports PNG, JPG, and WebP formats</div>
            </div>
            <input type="file" id="fileInput" class="file-input" accept=".png,.jpg,.jpeg,.webp">
        </div>

        <!-- Preview Section -->
        <div class="preview-section hidden" id="previewSection">
            <div class="preview-container">
                <img id="previewImage" class="preview-image" alt="Preview">
            </div>
        </div>

        <!-- Controls Section -->
        <div class="controls-section hidden" id="controlsSection">
            <div class="control-group">
                <label class="control-label">Presets:</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="presetMode" value="linux"> Linux</label>
                    <label class="radio-label"><input type="radio" name="presetMode" value="macos"> macOS</label>
                    <label class="radio-label"><input type="radio" name="presetMode" value="custom" checked> Custom</label>
                </div>
            </div>
            <div class="control-group">
                <label class="control-label" for="radiusSlider">
                    Squircle Radius: <span class="slider-value" id="radiusValue">20%</span>
                </label>
                <input type="range" id="radiusSlider" class="slider" min="0" max="50" step="0.5" value="20">
            </div>
            <div class="control-group">
                <label class="control-label" for="paddingSlider">
                    Padding: <span class="slider-value" id="paddingValue">0%</span>
                </label>
                <input type="range" id="paddingSlider" class="slider" min="0" max="30" step="0.5" value="0">
            </div>
        </div>

        <!-- Download Section -->
        <div class="download-section hidden" id="downloadSection">
            <button class="btn btn-large" id="downloadBtn">Save Squircular PNG</button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-text">
            Made by <a href="https://github.com/azmaldev/squircle-generator" title="https://github.com/azmaldev/squircle-generator" target="_blank" class="footer-link">@azmaldev</a> and <a href="https://github.com/ernstki" title="https://github.com/ernstki" target="_blank" class="footer-link">@ernstki</a>
        </div>
        <a id="app-version" class="version-text" target="_blank"></a>
    </footer>

    <!-- Hidden canvas for image processing -->
    <canvas id="canvas"></canvas>

    <script>
        // Intercept clicks on target="_blank" links and open them in the default OS browser
        document.addEventListener('click', (e) => {
            const target = e.target.closest('a');
            if (target && target.getAttribute('target') === '_blank') {
                e.preventDefault();
                if (window.__TAURI_INTERNALS__) {
                    window.__TAURI_INTERNALS__.invoke('plugin:opener|open_url', { url: target.href });
                } else {
                    window.open(target.href, '_blank');
                }
            }
        });
    </script>
    <script src="meta.js"></script>
    <script src="main.js"></script>
</body>
</html>
